name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: false

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package and Push Helm Chart to GHCR OCI
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Authenticate Helm with GHCR OCI registry
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

          # Strip leading 'v' from tag name (e.g. v0.1.0 -> 0.1.0)
          CHART_VERSION="${GITHUB_REF_NAME#v}"
          OWNER_LOWER=$(echo "${REGISTRY_OWNER}" | tr '[:upper:]' '[:lower:]')
          DIST_DIR="./dist-helm"
          mkdir -p "${DIST_DIR}"

          echo "Packaging Helm chart (version: ${CHART_VERSION})..."
          helm package ./helm \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}" \
            --destination "${DIST_DIR}"

          PKG_FILE=$(find "${DIST_DIR}" -name "*.tgz" | head -n 1)
          if [ -z "${PKG_FILE}" ]; then
            echo "Error: Helm chart package not found in ${DIST_DIR}!"
            exit 1
          fi

          echo "Pushing ${PKG_FILE} to oci://${{ env.REGISTRY }}/${OWNER_LOWER}/charts..."
          helm push "${PKG_FILE}" "oci://${{ env.REGISTRY }}/${OWNER_LOWER}/charts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          files: ./dist-helm/*.tgz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
