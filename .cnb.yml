# ── 全局：手动触发 & 标签发布 ────────────────────────────────────────
# 项目: next-sn-admin (Next.js 16 Enterprise Admin Dashboard)
# 架构: React 19 + Next.js 16 Standalone (Node 22 / Bun) | 端口: 3200
# Dockerfile 基于 Next.js 官方 standalone 多阶段轻量镜像构建
# ── main 分支：代码推送与手动触发 ────────────────────────────────────
main:
  # 推送 main 自动触发：构建并推送 Alpine (仅 linux/amd64) 镜像
  push: &docker_amd64
    - services:
        - docker
      stages:
        - name: Docker build and push (Alpine amd64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --tag "${REGISTRY}:latest-amd64" \
              --tag "${REGISTRY}:alpine-amd64" \
              --platform linux/amd64 \
              --file ./Dockerfile \
              --build-arg NEXT_PUBLIC_ENABLE_MOCK="${NEXT_PUBLIC_ENABLE_MOCK:-true}" \
              --cache-from type=registry,ref=${REGISTRY}:alpine-amd64-cache \
              --cache-to type=registry,ref=${REGISTRY}:alpine-amd64-cache,mode=max,image-manifest=true,oci-mediatypes=true \
              --push \
              .

  # 网页手动触发：构建并推送 Alpine (仅 linux/amd64) 镜像
  web_trigger_amd64: *docker_amd64

# ── 版本发布：仅在推送 v* 标签时执行 ──────────────────────────────────
$:
  # 推送 v* 标签：构建并推送版本化 Alpine (linux/amd64) 镜像
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push Alpine release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"
            docker buildx build \
              --tag "${REGISTRY}:${VERSION}" \
              --tag "${REGISTRY}:${VERSION}-alpine" \
              --tag "${REGISTRY}:latest" \
              --tag "${REGISTRY}:alpine" \
              --platform linux/amd64 \
              --file ./Dockerfile \
              --build-arg NEXT_PUBLIC_ENABLE_MOCK="${NEXT_PUBLIC_ENABLE_MOCK:-true}" \
              --cache-from type=registry,ref=${REGISTRY}:alpine-release-cache \
              --cache-to type=registry,ref=${REGISTRY}:alpine-release-cache,mode=max,image-manifest=true,oci-mediatypes=true \
              --push \
              .

  # 标签部署流水线：运行类型与代码规范检查
  tag_deploy:
    - stages:
        - name: Lint and format check
          image: oven/bun:1.4-alpine
          script: |
            set -euo pipefail
            bun install --frozen-lockfile
            bun run check
            bun run lint
            bun run fmt:check
