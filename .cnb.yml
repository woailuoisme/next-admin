# ── CNB CI/CD 流水线配置 ──────────────────────────────────────────────
# 项目: next-sn-admin (Next.js 16 Enterprise Admin Dashboard)
# 架构: React 19 + Next.js 16 Standalone (Node 22 / Bun) | 端口: 3200
# 产物规范: 统一仅维护 :latest 镜像与 :cache 缓存层
# ──────────────────────────────────────────────────────────────────────

main:
  # 代码推送至 main 分支自动触发构建与推送
  push: &docker_build
    - services:
        - docker
      stages:
        - name: Docker build and push (latest & cache)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --platform linux/amd64 \
              --file ./Dockerfile \
              --build-arg NEXT_PUBLIC_ENABLE_MOCK="${NEXT_PUBLIC_ENABLE_MOCK:-true}" \
              --cache-from type=registry,ref="${REGISTRY}:cache" \
              --cache-to type=registry,ref="${REGISTRY}:cache,mode=max,image-manifest=true,oci-mediatypes=true" \
              -t "${REGISTRY}:latest" \
              --push \
              .

  # 控制台页面手动触发
  web_trigger: *docker_build
