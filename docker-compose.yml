services:
  app:
    build:
      context: .
    image: next-sn-admin:latest
    container_name: next-sn-admin
    pull_policy: build
    ports:
      - "${PORT:-3500}:${PORT:-3500}"
    environment:
      PORT: "${PORT:-3500}"
      SERVER_URL: ${SERVER_URL:-http://localhost:3500}
    restart: unless-stopped
